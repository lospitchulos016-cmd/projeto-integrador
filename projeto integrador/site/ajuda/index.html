<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f7f1ea">
	<title>Atendimento | Los Pitchulos</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="pagina-sac">
		<header class="cabecalho-sac">
			<a class="voltar-inicio" href="../home/index.html" aria-label="Voltar para a Home">‹ <span>Home</span></a>
			<p class="sobretitulo">LOS PITCHULOS · ATENDIMENTO</p>
			<h1>Queremos ouvir você.</h1>
			<p class="introducao">Envie uma sugestão, conte como foi seu pedido ou fale sobre algo que podemos melhorar.</p>
		</header>

		<form id="formFeedback" class="form-feedback">
			<div class="campos-duplos">
				<div class="campo">
					<label for="nome">Seu nome</label>
					<input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como podemos chamar você?" required>
				</div>
				<div class="campo">
					<label for="email">Seu e-mail</label>
					<input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
				</div>
			</div>

			<div class="campo">
				<label for="assunto">Sobre o que você quer falar?</label>
				<select id="assunto" name="assunto" required>
					<option value="" selected disabled>Selecione um assunto</option>
					<option>Experiência com o pedido</option>
					<option>Qualidade dos pratos</option>
					<option>Entrega</option>
					<option>Sugestão</option>
					<option>Outro assunto</option>
				</select>
			</div>

			<div class="campo">
				<label for="mensagem">Seu feedback</label>
				<textarea id="mensagem" name="mensagem" rows="7" maxlength="3000" placeholder="Escreva sua mensagem..." required></textarea>
				<span class="contador" id="contadorMensagem">0 / 3000</span>
			</div>

			<div class="acoes-feedback">
				<button type="submit" class="botao-enviar">Enviar feedback</button>
				
			</div>
			<p class="status-envio" id="statusEnvio" role="status" aria-live="polite"></p>
			<a class="fallback-email" id="fallbackEmail" hidden>Se o aplicativo de e-mail não abrir, clique aqui para preparar a mensagem.</a>
		</form>

		<footer class="rodape-sac">
			<a href="../home/index.html">Voltar para a Los Pitchulos</a>
		</footer>
	</main>
	<script src="../banco/banco.js"></script>
	<script src="script.js"></script>
</body>
</html>
