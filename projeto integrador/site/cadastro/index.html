<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los pitchulos - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    
    <div class="card" id="card-cadastro">
      <div class="header">
        <img src="img/logo.png">
       
        <h1>Los pitchulos</h1>
        <p>Crie sua conta para fazer seu pedido</p>
      </div>

      
      <form id="form-cadastro">
        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn-submit">Cadastrar</button>
      </form>

     
      <div id="mensagem-sucesso" class="sucesso hidden">
        <span class="sucesso-icon">🎉</span>
        <h2>Bem-vindo(a), <span id="nome-usuario"></span>!</h2>
        <p>Sua conta foi criada com sucesso.</p>
      </div>

      <div class="footer">
        <p>Já tem uma conta? <a href="../login/index.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <script src="scripit.js"></script>
</body>
</html>
