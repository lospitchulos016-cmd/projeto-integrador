<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f7f1ea">
	<title>Seu pedido | Los Pitchulos</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="checkout">
		<header class="cabecalho-checkout">
			<a class="botao-voltar" href="../carrinho/index.html" aria-label="Voltar para o carrinho">‹</a>
			<div>
				<p class="sobretitulo">LOS PITCHULOS</p>
				<h1>Seu pedido</h1>
			</div>
		</header>

		<section class="itens-pedido" aria-labelledby="titulo-itens">
			<div class="titulo-secao">
				<h2 id="titulo-itens">Itens do carrinho</h2>
				<a href="../cardapio/index.html">Adicionar mais itens</a>
			</div>
			<div id="listaCarrinho" class="lista-carrinho" aria-live="polite"></div>
		</section>

		<form id="formCheckout" class="form-checkout">
			<section class="dados-entrega" aria-labelledby="titulo-entrega">
				<h2 id="titulo-entrega">Entrega</h2>
				<label for="enderecoEntrega">Endereço de entrega</label>
				<input id="enderecoEntrega" name="endereco" type="text" autocomplete="street-address" required>
				<p class="ajuda-endereco">O endereço salvo na página inicial será preenchido automaticamente.</p>
			</section>

			<section class="resumo-pedido" aria-labelledby="titulo-resumo">
				<h2 id="titulo-resumo">Resumo</h2>
				<div class="linha-resumo"><span>Subtotal</span><strong id="subtotalPedido">R$ 0,00</strong></div>
				<div class="linha-resumo"><span>Entrega</span><strong id="taxaEntrega">Grátis</strong></div>
				<div class="linha-resumo total"><span>Total</span><strong id="totalPedido">R$ 0,00</strong></div>
				<button class="botao-finalizar" type="submit">Confirmar pedido</button>
				<p id="mensagemCheckout" class="mensagem-checkout" role="status" aria-live="polite"></p>
			</section>
		</form>
	</main>

	<script src="../banco/banco.js"></script>
	<script src="script.js"></script>
</body>
</html>
