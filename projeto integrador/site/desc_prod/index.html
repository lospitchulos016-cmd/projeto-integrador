<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f1ea">
    <title>Burritos - Los Pitchulos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <a class="btn-voltar" href="../home/index.html" aria-label="Voltar para o início" title="Voltar para o início">‹</a>
            <div class="titulo">
                <h1>Burritos</h1>
                <p>Feitos na hora, do seu jeito <span id="filtrosAtivos">[Todos]</span></p>
            </div>
        </header>

        <form class="busca-cardapio" id="formBuscaBurritos" role="search">
            <label class="visually-hidden" for="buscaBurritos">Buscar burritos</label>
            <input id="buscaBurritos" type="search" placeholder="Buscar burritos">
            <button type="submit" aria-label="Buscar">⌕</button>
        </form>

        <nav class="filtros" aria-label="Filtrar burritos">
            <button class="filtro ativo" type="button" data-filtro="todos" aria-pressed="true">Todos</button>
            <button class="filtro" type="button" data-filtro="carne" aria-pressed="false">Carne</button>
            <button class="filtro" type="button" data-filtro="vegano" aria-pressed="false">Vegano</button>
        </nav>

        <section class="lista-produtos" id="listaProdutos" aria-label="Lista de burritos" aria-live="polite"></section>

        <aside class="barra-carrinho" aria-label="Resumo do pedido">
            <div class="informacoes-carrinho">
                <strong id="quantidadeCarrinho">0 itens</strong>
                <span id="totalCarrinho">R$ 0,00</span>
            </div>
            <button class="btn-carrinho" id="abrirCarrinho" type="button">Ver pedido</button>
        </aside>
    </main>

    <div class="modal" id="modalCarrinho" aria-hidden="true">
        <section class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="tituloCarrinho">
            <button class="fechar" id="fecharCarrinho" type="button" aria-label="Fechar pedido">×</button>
            <h2 id="tituloCarrinho">Seu pedido</h2>
            <div id="itensCarrinho"></div>
            <div class="total-modal"><span>Total</span><strong id="totalModal">R$ 0,00</strong></div>
            <button class="btn-finalizar" id="finalizarPedido" type="button">Finalizar pedido</button>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
</body>
</html>
